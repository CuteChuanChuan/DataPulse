[project]
name = "datapulse"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.13"
dependencies = [
    "connectorx>=0.4.4",
    "duckdb>=1.4.1",
    "loguru>=0.7.3",
    "polars>=1.34.0",
    "pydantic>=2.12.0",
    "pytest>=8.4.2",
]

[dependency-groups]
dev = [
    "black>=25.9.0",
    "ruff>=0.14.0",
]


[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.format]
quote-style = "single"